<!-- Standard: IEC 60617 | Pitch P = 20 px | Signal stroke 2 px | Power stroke 3 px -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 718 178" width="718" height="178">
<title>Unity-feedback PID loop</title>
<desc>Schematic generated deterministically from a grid-snapped spec.</desc>
<rect x="0" y="0" width="718" height="178" fill="#fff"/>
<g id="wires" fill="none" stroke="#000" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" shape-rendering="crispEdges">
<polyline points="39,50 89,50"/>
<polyline points="139,50 189,50"/>
<polyline points="319,50 389,50"/>
<polyline points="519,50 679,50"/>
<polyline points="599,50 599,150 119,150 119,80"/>
<polygon points="99,50 89,54 89,46" fill="#000" stroke-linejoin="miter"/>
<polygon points="199,50 189,54 189,46" fill="#000" stroke-linejoin="miter"/>
<polygon points="399,50 389,54 389,46" fill="#000" stroke-linejoin="miter"/>
<polygon points="119,70 123,80 115,80" fill="#000" stroke-linejoin="miter"/>
</g>
<g id="parts" fill="none" stroke="#000" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" font-family="Helvetica, Arial, sans-serif">
<g>
<circle cx="39" cy="50" r="4" fill="#fff"/>
</g>
<g>
<circle cx="119" cy="50" r="20" fill="#fff"/>
<line x1="105" y1="36" x2="133" y2="64"/>
<line x1="105" y1="64" x2="133" y2="36"/>
<text x="89" y="45" text-anchor="middle" font-size="20" font-weight="bold" fill="#000" stroke="none">+</text>
<text x="131" y="87" text-anchor="middle" font-size="20" font-weight="bold" fill="#000" stroke="none">−</text>
</g>
<g>
<rect x="199" y="30" width="120" height="40" fill="#fff"/>
<text x="259" y="55" text-anchor="middle" font-size="14" fill="#000" stroke="none">C(s) = PID</text>
</g>
<g>
<rect x="399" y="30" width="120" height="40" fill="#fff"/>
<text x="459" y="55" text-anchor="middle" font-size="14" fill="#000" stroke="none">G(s)</text>
</g>
<g>
<circle cx="679" cy="50" r="4" fill="#fff"/>
</g>
</g>
<g id="junctions" fill="#000" stroke="none">
<circle cx="599" cy="50" r="3"/>
</g>
<g id="labels" fill="#000" stroke="none" font-family="Times New Roman, Times, serif" font-size="16">
<text x="39" y="39" text-anchor="middle"><tspan font-style="italic">r</tspan>(<tspan font-style="italic">t</tspan>)</text>
<text x="679" y="39" text-anchor="middle"><tspan font-style="italic">y</tspan>(<tspan font-style="italic">t</tspan>)</text>
<text x="159" y="44" text-anchor="middle"><tspan font-style="italic">e</tspan>(<tspan font-style="italic">t</tspan>)</text>
<text x="359" y="44" text-anchor="middle"><tspan font-style="italic">u</tspan>(<tspan font-style="italic">t</tspan>)</text>
</g>
</svg>
