<!-- Standard: IEC 60617 | Pitch P = 20 px | Signal stroke 2 px | Power stroke 3 px -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 714 178" width="714" height="178">
<title>Unity-feedback PID loop</title>
<desc>Schematic generated deterministically from a grid-snapped spec.</desc>
<rect x="0" y="0" width="714" height="178" fill="#fff"/>
<g id="wires" fill="none" stroke="#000" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" shape-rendering="crispEdges">
<polyline points="37,50 87,50"/>
<polyline points="137,50 187,50"/>
<polyline points="317,50 387,50"/>
<polyline points="517,50 677,50"/>
<polyline points="597,50 597,150 117,150 117,80"/>
<polygon points="97,50 87,54 87,46" fill="#000" stroke-linejoin="miter"/>
<polygon points="197,50 187,54 187,46" fill="#000" stroke-linejoin="miter"/>
<polygon points="397,50 387,54 387,46" fill="#000" stroke-linejoin="miter"/>
<polygon points="117,70 121,80 113,80" fill="#000" stroke-linejoin="miter"/>
</g>
<g id="parts" fill="none" stroke="#000" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" font-family="Helvetica, Arial, sans-serif">
<g>
<circle cx="37" cy="50" r="4" fill="#fff"/>
</g>
<g>
<circle cx="117" cy="50" r="20" fill="#fff"/>
<line x1="103" y1="36" x2="131" y2="64"/>
<line x1="103" y1="64" x2="131" y2="36"/>
<text x="87" y="45" text-anchor="middle" font-size="20" font-weight="bold" fill="#000" stroke="none">+</text>
<text x="129" y="87" text-anchor="middle" font-size="20" font-weight="bold" fill="#000" stroke="none">−</text>
</g>
<g>
<rect x="197" y="30" width="120" height="40" fill="#fff"/>
<text x="257" y="55" text-anchor="middle" font-size="14" fill="#000" stroke="none">C(s) = PID</text>
</g>
<g>
<rect x="397" y="30" width="120" height="40" fill="#fff"/>
<text x="457" y="55" text-anchor="middle" font-size="14" fill="#000" stroke="none">G(s)</text>
</g>
<g>
<circle cx="677" cy="50" r="4" fill="#fff"/>
</g>
</g>
<g id="junctions" fill="#000" stroke="none">
<circle cx="597" cy="50" r="3"/>
</g>
<g id="labels" fill="#000" stroke="none" font-family="Helvetica, Arial, sans-serif" font-size="14">
<text x="37" y="40" text-anchor="middle">r(t)</text>
<text x="677" y="40" text-anchor="middle">y(t)</text>
<text x="157" y="44" text-anchor="middle">e(t)</text>
<text x="357" y="44" text-anchor="middle">u(t)</text>
</g>
</svg>
